[package]
name = "studystake_bounties"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Test-only: lets integration tests register a real studystake_reputation
# instance in the same Env to prove genuine cross-contract invocation.
# Production code never depends on this crate — see src/reputation.rs.
studystake_reputation = { path = "../studystake_reputation" }
